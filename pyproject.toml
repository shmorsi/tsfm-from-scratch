[project]
name = "tsfm"
version = "0.1.0"
description = "A small time-series foundation model pretrained from scratch and evaluated on GIFT-Eval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Sherif Morsi" }]
# Versions are pinned to what the official GIFT-Eval scoring path needs
# (gluonts~=0.15.1, numpy~=1.26, datasets~=2.17) so our scores are computed
# with the same code the leaderboard uses.
dependencies = [
  "numpy~=1.26.4",
  "pandas>=2.2,<3",
  "pyarrow>=15,<21",
  "scipy>=1.11.4,<1.14",
  "pyyaml>=6",
  "gluonts~=0.15.1",
  "datasets~=2.17.1",
  "python-dotenv>=1.0",
  "toolz>=0.12",
  "orjson>=3.9",
  "statsforecast==2.1.1",
  "huggingface-hub>=0.24,<1",
]

[project.urls]
Homepage = "https://shmorsi.github.io/"
"Case study" = "https://shmorsi.github.io/projects/tsfm.html"
Repository = "https://github.com/shmorsi/tsfm-from-scratch"

[project.optional-dependencies]
cpu = ["torch==2.14.1"]
cu126 = ["torch==2.14.1"]

[project.scripts]
tsfm = "tsfm.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "mypy>=1.13",
  "pandas-stubs",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsfm"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["src/tsfm/eval/_vendor"]

[tool.ruff.format]
exclude = ["*.ipynb"]  # generated by scripts/make_colab_notebook.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF", "PT"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Colab cells: one-line imports, imports after drive.mount, names from earlier cells and
# IPython `!cmd {var}` interpolation are normal there. tests/test_notebook.py compiles
# every cell.
"*.ipynb" = ["E401", "E402", "I001", "SIM115", "B007", "F821"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tsfm"]
exclude = ["src/tsfm/eval/_vendor/"]
ignore_missing_imports = true
warn_unused_ignores = false
# Bare np.ndarray annotations are fine here; dtype/shape are documented in docstrings.
disallow_any_generics = false

[[tool.mypy.overrides]]
# torch's stubs return Any from nn.Module.__call__ and leave Tensor.backward untyped.
module = ["tsfm.model", "tsfm.forecast", "tsfm.tokenizers", "tsfm.train.*", "tsfm.data.synthetic", "tsfm.data.leakage", "tsfm.finance.*"]
warn_return_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: takes more than ~30 s; excluded from the default CI job",
  "network: needs internet access",
  "data: needs the local data cache built by `tsfm data build`",
]
filterwarnings = ["ignore::DeprecationWarning"]
