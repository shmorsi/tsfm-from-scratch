# CPU study. Binding text: PREREGISTRATION_CPU.md.
# Do not edit this file in order to improve a test score. A change after the test
# split has been scored is a new study and goes under results/eval/exploratory/.
name: cpu_s0
seeds: [0, 1, 2]
max_context: 512
eval_batch_size: 64
synthetic:
  n_series: 8000
  length: 384
  val_series: 400
  max_kernels: 5
  seed: 20261020
model:
  tokenizer: patch
  d_model: 128
  n_layers: 4
  n_heads: 4
  patch_len: 16
  horizon: 32
  max_seq_len: 128
  dropout: 0.0
  position: rope
data:
  corpora:
    - path: pretrain
    - path: synthetic
      synthetic: true
  val:
    - path: synthetic_val
      synthetic: true
  window: 384
  min_context: 32
  synthetic_share: 0.75
  temperature: 0.5
  val_batches: 8
  val_batch_size: 64
  val_seed: 12345
train:
  steps: 2000
  batch_size: 32
  micro_batch: 16
  lr: 0.003
  warmup: 40
  min_lr_ratio: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  precision: fp32
  device: cpu
  ckpt_minutes: 10
  eval_every: 200
  log_every: 20
