# Tokenizer (a) at the s2 size and the same token budget as patch_s2 (1500 steps x 130816 tokens).
name: bins_s2
seed: 0
model:
  tokenizer: bins
  d_model: 320
  n_layers: 8
  n_heads: 5
  n_bins: 4094
  bin_limit: 15.0
  max_seq_len: 1024
  dropout: 0.0
data:
  corpora:
  - path: pretrain
  - path: synthetic
    synthetic: true
  val:
  - path: val
  - path: synthetic_val
    synthetic: true
  window: 512
  min_context: 32
  synthetic_share: 0.1
  temperature: 0.5
  val_batches: 16
  val_batch_size: 128
train:
  steps: 1500
  batch_size: 256
  micro_batch: 64
  lr: 0.0006
  warmup: 50
  min_lr_ratio: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  precision: fp16
  device: auto
  ckpt_minutes: 10
  eval_every: 100
  log_every: 50
