# Scale on CPU between 2 and 8 replicas: forecasts are CPU-bound.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsfm-serve
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: tsfm-serve}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
