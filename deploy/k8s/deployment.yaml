# The forecasting service on Kubernetes: two replicas, probes on /health, Prometheus scraping /metrics.
# Image: build with `docker build -t <registry>/tsfm-serve:<tag> .`, push, and set it below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsfm-serve
  labels: {app: tsfm-serve}
spec:
  replicas: 2
  selector:
    matchLabels: {app: tsfm-serve}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: tsfm-serve}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: tsfm
          image: ghcr.io/shmorsi/tsfm-serve:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: TSFM_THREADS, value: "2"}
            - {name: TSFM_MAX_SERIES, value: "256"}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
