<title id="fig-title">From a pinned corpus to a single test score</title>
<desc id="fig-desc">Six stages: pinned corpus, leakage audit, training windows, decoder, validation (where the headline is chosen), and the test split. The test split has not been scored. The validation readout and the CPU-model verdicts are read from results.</desc>
