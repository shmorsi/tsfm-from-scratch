<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Decoder block</title>
<desc id="fig-desc">A pre-norm decoder block: RMSNorm, causal attention with rotary positions, a residual add, RMSNorm, SwiGLU, a residual add, then a quantile head or token logits. The patch quantile head is the one that was selected.</desc>
