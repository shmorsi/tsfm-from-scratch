name: image

# Publish the serving image to GitHub's container registry on every merge to main that
# changes what goes into it. deploy/k8s/deployment.yaml points at ghcr.io/shmorsi/tsfm-serve.
on:
  push:
    branches: [main]
    paths: ["Dockerfile", "src/**", "pyproject.toml", "uv.lock", "results/runs/cpu_s0_seed0/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tsfm-serve:latest
            ghcr.io/${{ github.repository_owner }}/tsfm-serve:${{ github.sha }}
